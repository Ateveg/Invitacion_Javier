<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Invitación Javier</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <img id="portada"
         src="img/portada.png"
         alt="Portada">

    <picture id="contenedorCarta">

        <!-- Celulares -->

        <source
            media="(max-width:768px)"
            srcset="img/carta_movil.png">

        <!-- PC -->

        <img id="carta"
             src="img/carta_pc.png"
             alt="Carta">

    </picture>

    <audio
        id="ambiente"
        src="audio/ambiente.mp3"
        preload="auto"
        loop>
    </audio>

    <div id="acciones">

        <button id="btnUbicacion">

            📍 Ver ubicación

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
